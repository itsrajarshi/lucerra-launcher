name: Bug report
description: Something does not work as expected
title: "[Bug] "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: TV or box and Android version
      placeholder: Mi Box 4K, Android 12
  - type: input
    id: version
    attributes:
      label: Lucerra version
      placeholder: v0.1.0
  - type: markdown
    attributes:
      value: Issues are public. Please leave out IP addresses and personal data.
